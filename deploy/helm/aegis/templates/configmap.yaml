apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}-config
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  mode: {{ .Values.config.mode | quote }}
  backend: {{ .Values.config.backend | quote }}
  duration: {{ .Values.config.duration | quote }}
